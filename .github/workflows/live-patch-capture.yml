name: Live patch capture
on:
  push:
    branches: [data-mining/live-patch-audit-20261112]
    paths: ['.github/workflows/live-patch-capture.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/live-patch-capture.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-mining/live-patch-audit-20261112
      - name: Capture public manifests and resources
        shell: bash
        run: |
          mkdir -p capture
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, hashlib, re, time
          root=pathlib.Path("capture")
          report=[]
          def get(url, path):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      data=r.read(100_000_001)
                      if len(data)>100_000_000: raise ValueError("resource exceeds cap")
                      path.write_bytes(data)
                      report.append(dict(url=url,file=str(path),status=r.status,sha256=hashlib.sha256(data).hexdigest(),size=len(data),last_modified=r.headers.get("Last-Modified")))
                      return data
              except Exception as e:
                  report.append(dict(url=url,error=str(e)))
                  return None
          for region,base in [("en","https://hwen-cdn.blmarkbsk.xyz/hwen/channel/app/"),("kr","https://hwkr-cdn.techplmnet.site/hwkr/channel/app/")]:
              d=root/region
              d.mkdir()
              raw=get(base+"version.json",d/"version.json")
              idx=get(base+"index.js",d/"index.js")
              if not raw: continue
              try: v=json.loads(raw)
              except Exception: continue
              print(region,json.dumps(v)[:10000])
              def walk(o):
                  if isinstance(o,dict):
                      for k,x in o.items():
                          yield k,x
                          yield from walk(x)
                  elif isinstance(o,list):
                      for x in o: yield from walk(x)
              pairs=list(walk(v))
              for k,x in pairs:
                  if isinstance(x,str) and re.fullmatch(r"(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_.-]+\.(?:js|json)",x):
                      if x.endswith(".js") or "ref" in x.lower():
                          p=d/x.replace("/","_")
                          if not p.exists(): get(urllib.parse.urljoin(base,x),p)
              for k,x in pairs:
                  if k.lower()=="refflag" and isinstance(x,(str,int)) and re.fullmatch(r"[A-Za-z0-9_.-]+",str(x)):
                      refbase=base+"ref"+str(x)+"/"
                      pre=get(refbase+"preRef.json",d/"preRef.json")
                      if pre:
                          for i in range(20):
                              if get(refbase+f"ref{i}.json",d/f"ref{i}.json") is None: break
              if idx:
                  for name in set(re.findall(rb'(?:bundle|library)\.[a-fA-F0-9]+\.js',idx)):
                      n=name.decode()
                      if not (d/n).exists(): get(base+n,d/n)
          (root/"report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Inspect public deployment configuration
        shell: bash
        run: |
          mkdir -p capture/deployment
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, re, concurrent.futures, time
          root=pathlib.Path("capture/deployment")
          targets=[("en","https://hwen-newgm.blmarkbsk.xyz","hw_en"),("kr","https://hwkr-newgm.techplmnet.site","hw_kr"),("en_test","https://hwen-test-newgm.blmarkbsk.xyz","hw_en_test"),("kr_test","https://hwkr-test-newgm.techplmnet.site","hw_kr_test")]
          def probe(t):
              region,host,product,version=t
              url=f"{host}/infocenter/static3/{product}/upgrade/json/main/com.minipirateclash.googlelb.json?app_ver_name={version}&dt={int(time.time()*1000)}"
              result={"region":region,"url":url}
              try:
                  req=urllib.request.Request(url,data=b"",headers={"User-Agent":"Mozilla/5.0","Content-Type":"application/json"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      raw=response.read(5000000)
                      result["status"]=response.status
                  obj=json.loads(raw)
                  (root/f"{region}-{version}.json").write_bytes(raw)
                  cfg=obj.get("resourcesUpdateConfigV3")
                  result["config"]=cfg
                  def walk(x):
                      if isinstance(x,dict):
                          for k,v in x.items():
                              if k in ("clientPath","clientAuditPath") and isinstance(v,str) and v.startswith("https://"): yield v
                              yield from walk(v)
                      elif isinstance(x,list):
                          for v in x: yield from walk(v)
                  for i,base in enumerate(set(walk(cfg))):
                      for name in ("version.json","index.js"):
                          try:
                              with urllib.request.urlopen(base.rstrip("/")+"/"+name,timeout=20) as response: data=response.read(20000000)
                              (root/f"{region}-{version}-{i}-{name}").write_bytes(data)
                              result.setdefault("resources",[]).append({"base":base,"name":name,"bytes":len(data)})
                          except Exception as e: result.setdefault("errors",[]).append(str(e))
              except Exception as e: result["error"]=str(e)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(probe,[(r,h,p,v) for r,h,p in targets for v in ("1.0.3","1.27.0","1.28.0")]))
          (root/"deployment-report.json").write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Compare candidate public resource manifests
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json, pathlib, concurrent.futures, hashlib
          out=pathlib.Path("capture/resource-probes")
          out.mkdir(exist_ok=True)
          targets=[]
          for host,product in [("hwen-cdn.blmarkbsk.xyz","hwen"),("hwkr-cdn.techplmnet.site","hwkr"),("hwen-test-cdn.blmarkbsk.xyz","hwen"),("hwkr-test-cdn.techplmnet.site","hwkr")]:
              for prefix in (product,product+"_test",product+"-test"):
                  for channel in ("channel/app","channel/test","channel/audit"):
                      targets.append("https://"+host+"/"+prefix+"/"+channel+"/version.json")
          def check(url):
              result={"url":url}
              try:
                  with urllib.request.urlopen(url,timeout=12) as response:
                      raw=response.read(30000000)
                      result["status"]=response.status
                      result["last_modified"]=response.headers.get("Last-Modified")
                  obj=json.loads(raw)
                  result["build"]=obj.get("clientVerCode")
                  result["sha256"]=hashlib.sha256(raw).hexdigest()
                  if result["build"] is not None:
                      name=hashlib.sha256(url.encode()).hexdigest()[:16]
                      (out/(name+".json")).write_bytes(raw)
                      base=url.rsplit("/",1)[0]
                      try:
                          with urllib.request.urlopen(base+"/index.js",timeout=12) as response: index=response.read(1000000)
                          (out/(name+"-index.js")).write_bytes(index)
                          result["index"]=index.decode(errors="replace")[:2000]
                      except Exception as e: result["index_error"]=str(e)
              except Exception as e: result["error"]=str(e)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(check,targets))
          (out/"report.json").write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-patch-capture
          path: capture/
      - name: Publish capture index
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p patch-capture-index
          cp capture/report.json patch-capture-index/report.json
          for region in en kr; do
            if test -f "capture/$region/version.json"; then
              cp "capture/$region/version.json" "patch-capture-index/$region-version.json"
            fi
          done
          printf '%s\n' "$GITHUB_RUN_ID" > patch-capture-index/run-id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patch-capture-index
          git diff --cached --quiet || git commit -m 'Publish live patch capture index'
          git push origin HEAD:data-mining/live-patch-audit-20261112
